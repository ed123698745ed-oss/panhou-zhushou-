name: Market Data Test

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "交易日 YYYY-MM-DD（留空則為今天）"
        required: false
        type: string

  schedule:
    # 週一到週五 台北時間 20:00（= UTC 12:00）
    - cron: "0 12 * * 1-5"

jobs:
  market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Fetch and push to LINE
        shell: bash
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          if [ -n "${{ inputs.market_date }}" ]; then
            python send_line.py --date "${{ inputs.market_date }}"
          else
            python send_line.py
          fi
