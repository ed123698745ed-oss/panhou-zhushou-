name: Market Data Test

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "交易日 YYYY-MM-DD（留空使用台北今天）"
        required: false
        type: string

jobs:
  market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Fetch market data
        shell: bash
        run: |
          if [ -n "${{ inputs.market_date }}" ]; then
            python fetch_market_data.py --date "${{ inputs.market_date }}"
          else
            python fetch_market_data.py
          fi
