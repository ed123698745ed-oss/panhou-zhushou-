name: Chart Daily

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""
      chart:
        description: "要產生的圖表"
        type: choice
        options: [all, foreign, dealer, mtx, tmf, margin]
        default: all
      dry_run:
        description: "只上傳不推播 LINE"
        type: boolean
        default: false
      force:
        description: "忽略記號檔，強制重推"
        type: boolean
        default: false
      max_fetch:
        description: "本次最多補幾天（回補分批用，留空=不限）"
        required: false
        default: ""

  schedule:
    # 下午分四次嘗試（台北時間）。資料未更新時程式會自行略過，
    # 推播成功後寫記號檔，同一天不會重複推。
    - cron: "5 9 * * 1-5"     # 17:05
    - cron: "5 10 * * 1-5"    # 18:05
    - cron: "5 11 * * 1-5"    # 19:05
    - cron: "10 12 * * 1-5"   # 20:10（保底）

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install matplotlib requests beautifulsoup4

      - name: 產生並推播圖表
        env:
          CHARTS_TOKEN: ${{ secrets.CHARTS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FONT_DIR: ${{ runner.temp }}
        run: |
          # 排程觸發時 inputs 為空，chart 要有預設值，否則 argparse 會失敗
          ARGS="--chart ${{ inputs.chart || 'all' }}"
          if [ -n "${{ inputs.market_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.market_date }}"
          fi
          if [ -n "${{ inputs.max_fetch }}" ]; then
            ARGS="$ARGS --max-fetch ${{ inputs.max_fetch }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "執行：python charts.py $ARGS"
          python charts.py $ARGS
