name: Chart Daily

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""
      chart:
        description: "要產生的圖表"
        type: choice
        options: [all, foreign, mtx]
        default: all
      dry_run:
        description: "只上傳不推播 LINE"
        type: boolean
        default: false
      max_fetch:
        description: "本次最多補幾天（回補分批用，留空=不限）"
        required: false
        default: ""

  # 回補完成、測試穩定後再打開這段
  # schedule:
  #   - cron: "10 12 * * 1-5"   # 台北時間 20:10

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install matplotlib requests beautifulsoup4

      - name: 產生並推播圖表
        env:
          CHARTS_TOKEN: ${{ secrets.CHARTS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FONT_DIR: ${{ runner.temp }}
        run: |
          ARGS="--chart ${{ inputs.chart }}"
          if [ -n "${{ inputs.market_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.market_date }}"
          fi
          if [ -n "${{ inputs.max_fetch }}" ]; then
            ARGS="$ARGS --max-fetch ${{ inputs.max_fetch }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "執行：python charts.py $ARGS"
          python charts.py $ARGS
