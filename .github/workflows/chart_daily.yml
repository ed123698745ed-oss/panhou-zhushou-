name: Chart Daily

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""
      chart:
        description: "要產生的圖表"
        type: choice
        options: [all, foreign, dealer, mtx, tmf, margin]
        default: all
      dry_run:
        description: "只上傳不推播 LINE"
        type: boolean
        default: false
      force:
        description: "忽略記號檔，強制重推"
        type: boolean
        default: false
      max_fetch:
        description: "本次最多補幾天（回補分批用，留空=不限）"
        required: false
        default: ""

  schedule:
    # 下午分四次嘗試（台北時間）。避開整點的 GitHub Actions 排程尖峰。
    # 資料未更新時程式會自行略過；成功後同一天不會重複推播。
    - cron: "17 9 * * 1-5"    # 17:17
    - cron: "27 10 * * 1-5"   # 18:27
    - cron: "37 11 * * 1-5"   # 19:37
    - cron: "47 12 * * 1-5"   # 20:47（保底）

permissions:
  contents: read

concurrency:
  group: chart-daily
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install matplotlib requests beautifulsoup4

      - name: 錯開期交所請求
        # 18:30／20:30 外部觸發會同時啟動文字推播與圖表，兩支同時打期交所曾導致逾時（2026-10-28）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.market_date == '' }}
        run: sleep 60

      - name: 產生並推播圖表
        env:
          CHARTS_TOKEN: ${{ secrets.CHARTS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FONT_DIR: ${{ runner.temp }}
        run: |
          # 排程觸發時 inputs 為空，chart 要有預設值，否則 argparse 會失敗
          ARGS="--chart ${{ inputs.chart || 'all' }}"
          if [ -n "${{ inputs.market_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.market_date }}"
          fi
          if [ -n "${{ inputs.max_fetch }}" ]; then
            ARGS="$ARGS --max-fetch ${{ inputs.max_fetch }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "執行：python charts.py $ARGS"
          python charts.py $ARGS

      - name: Notify LINE on failure
        if: ${{ failure() && !inputs.dry_run }}
        env:
          MARKET_DATE: ${{ inputs.market_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          market_date = os.environ.get("MARKET_DATE") or datetime.now(
              timezone(timedelta(hours=8))
          ).date().isoformat()
          if os.path.exists("pushed_ok.flag"):
              text = (f"【盤後駐守圖表｜{market_date}】\n圖表已推播成功，但「已推播」記號寫入失敗，"
                      f"之後的排程可能重複推播同一批圖；請 Emit 補寫記號。\n{os.environ['RUN_URL']}")
          else:
              text = f"【盤後駐守圖表失敗｜{market_date}】\n圖表產生或推播失敗，稍後排程會再試；請查看 GitHub Actions：Chart Daily。\n{os.environ['RUN_URL']}"
          payload = {
              "to": os.environ["LINE_USER_ID"],
              "messages": [{
                  "type": "text",
                  "text": text,
              }],
          }
          request = urllib.request.Request(
              "https://api.line.me/v2/bot/message/push",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['LINE_CHANNEL_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Failure notification LINE status: {response.status}")
          PY
