name: Chart Daily

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "指定日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""
      dry_run:
        description: "只上傳不推播 LINE"
        type: boolean
        default: false

  # 測試穩定後再打開這段，讓它每天自動跑
  # schedule:
  #   - cron: "10 12 * * 1-5"   # 台北時間 20:10

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝套件
        run: pip install matplotlib requests

      - name: 產生並推播圖表
        env:
          CHARTS_TOKEN: ${{ secrets.CHARTS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FONT_DIR: ${{ runner.temp }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.market_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.market_date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python charts.py $ARGS
