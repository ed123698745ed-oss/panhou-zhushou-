name: Chart Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝套件
        run: pip install matplotlib requests

      - name: 畫圖 → 上傳 → 推播
        env:
          CHARTS_TOKEN: ${{ secrets.CHARTS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python - <<'PYEOF'
          import os, base64, time, requests
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from datetime import datetime, timezone, timedelta

          OWNER  = "ed123698745ed-oss"
          REPO   = "panhou-charts"
          BRANCH = "main"

          tw    = timezone(timedelta(hours=8))
          stamp = datetime.now(tw).strftime("%Y%m%d_%H%M%S")
          fname = f"test_{stamp}.png"

          # ---- 1. 畫一張陽春圖(全英文,避開中文字型問題) ----
          fig, ax = plt.subplots(figsize=(10, 5.5), dpi=110)
          ax.plot([1,2,3,4,5,6,7,8], [10,12,9,15,14,18,16,21],
                  color="#d62728", marker="o", linewidth=2)
          ax.set_title(f"PIPELINE TEST  {stamp}", fontsize=16)
          ax.grid(alpha=0.3)
          fig.tight_layout()
          fig.savefig(fname)
          print("[1] 圖已產生:", fname)

          # ---- 2. 上傳到公開 repo ----
          with open(fname, "rb") as f:
              b64 = base64.b64encode(f.read()).decode()

          api = f"https://api.github.com/repos/{OWNER}/{REPO}/contents/{fname}"
          r = requests.put(
              api,
              headers={"Authorization": f"Bearer {os.environ['CHARTS_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
              json={"message": f"test chart {stamp}", "content": b64, "branch": BRANCH},
              timeout=30,
          )
          print("[2] 上傳回應:", r.status_code)
          if r.status_code not in (200, 201):
              print(r.text)
              raise SystemExit("上傳失敗 — 檢查 CHARTS_TOKEN 權限或 BRANCH 名稱")

          url = f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{BRANCH}/{fname}"
          print("[3] 圖片網址:", url)

          # ---- 3. 等 CDN 生效,確認網址真的讀得到 ----
          for i in range(10):
              time.sleep(5)
              h = requests.get(url, timeout=20)
              print(f"    第{i+1}次檢查: {h.status_code} {h.headers.get('content-type')}")
              if h.status_code == 200:
                  break
          else:
              raise SystemExit("圖片網址讀不到 — raw 這條路不通,要改用 GitHub Pages")

          # ---- 4. 推播到 LINE ----
          r = requests.post(
              "https://api.line.me/v2/bot/message/push",
              headers={"Authorization": f"Bearer {os.environ['LINE_CHANNEL_ACCESS_TOKEN']}",
                       "Content-Type": "application/json"},
              json={"to": os.environ["LINE_USER_ID"],
                    "messages": [{"type": "image",
                                  "originalContentUrl": url,
                                  "previewImageUrl": url}]},
              timeout=30,
          )
          print("[4] LINE 回應:", r.status_code, r.text)
          if r.status_code != 200:
              raise SystemExit("推播失敗")

          print("[5] 全部成功")
          PYEOF
